<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Score Ping-Pong</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Score TT">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#10141c">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Compatible Safari 9 (iPad 2 / iOS 9.3.5) : pas de grid, pas de variables CSS, flex préfixé */
* { -webkit-box-sizing: border-box; box-sizing: border-box; -webkit-tap-highlight-color: rgba(0,0,0,0); }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #10141c; color: #fff;
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-text-size-adjust: 100%; }
button { font-family: inherit; cursor: pointer; }
.hidden { display: none !important; }

/* ---------- Écran de configuration ---------- */
#setup { position: absolute; top: 0; left: 0; right: 0; bottom: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 30px 20px; }
#setup .box { max-width: 560px; margin: 0 auto; background: #1b2230; border-radius: 14px; padding: 26px; }
#setup h1 { margin: 0 0 22px; font-size: 30px; text-align: center; }
#setup label { display: block; font-size: 17px; color: #9fb0c8; margin: 16px 0 6px; }
#setup input[type=text] { width: 100%; font-size: 24px; padding: 12px; border-radius: 8px; border: 2px solid #33405a;
  background: #0f141d; color: #fff; -webkit-user-select: text; user-select: text; -webkit-appearance: none; }
.choices { overflow: hidden; }
.choice { float: left; width: 31%; margin-right: 3.5%; padding: 14px 0; font-size: 20px; text-align: center; border-radius: 8px;
  background: #0f141d; border: 2px solid #33405a; color: #fff; }
.choice:last-child { margin-right: 0; }
.choices.two .choice { width: 48%; margin-right: 4%; }
.choices.two .choice:last-child { margin-right: 0; }
.choice.on { background: #2f7cf6; border-color: #2f7cf6; }
#startBtn { display: block; width: 100%; margin-top: 28px; padding: 18px; font-size: 26px; font-weight: bold;
  border: 0; border-radius: 10px; background: #1fb85b; color: #fff; }
#online { margin-top: 26px; padding-top: 6px; border-top: 1px solid #33405a; }
#syncStatus { margin-top: 10px; font-size: 16px; color: #9fb0c8; }
#syncStatus.err { color: #ff8f8c; } #syncStatus.ok { color: #6fdc9a; }
#resultsLink { display: block; margin-top: 16px; padding: 14px; text-align: center; font-size: 20px; color: #fff;
  background: #2f7cf6; border-radius: 10px; text-decoration: none; }
#resumeBtn { display: block; width: 100%; margin-top: 12px; padding: 14px; font-size: 20px; border: 0; border-radius: 10px;
  background: #33405a; color: #fff; }
#setup.wide .box { max-width: 760px; }

/* Onglets Match simple / Rencontre */
.tabs { overflow: hidden; margin: -6px 0 10px; }
.tab { float: left; width: 50%; padding: 14px 0; font-size: 19px; border: 0; background: #0f141d; color: #9fb0c8; }
.tab:first-child { border-radius: 10px 0 0 10px; } .tab:last-child { border-radius: 0 10px 10px 0; }
.tab.on { background: #2f7cf6; color: #fff; font-weight: bold; }

/* Rencontre par équipes */
#setup input[type=date] { width: 100%; font-size: 22px; padding: 10px 12px; border-radius: 8px; border: 2px solid #33405a;
  background: #0f141d; color: #fff; -webkit-appearance: none; min-height: 52px; }
.teamCol { float: left; width: 48%; } .teamCol + .teamCol { margin-left: 4%; }
.teamCols { overflow: hidden; }
.teamCol input.pl { font-size: 20px !important; padding: 10px !important; margin-bottom: 8px; }
.teamCol .lt { display: inline-block; width: 26px; color: #9fb0c8; font-weight: bold; }
.plRow { overflow: hidden; } .plRow .lt { float: left; line-height: 46px; } .plRow input { float: left; width: 85% !important; }
.c1 { color: #7fb0ff !important; } .c2 { color: #ff8f8c !important; }
.bigBtn { display: block; width: 100%; margin-top: 22px; padding: 16px; font-size: 22px; font-weight: bold; border: 0; border-radius: 10px;
  background: #1fb85b; color: #fff; }
.smallBtns { overflow: hidden; margin-top: 16px; }
.smallBtns button { float: left; width: 48%; padding: 12px 0; font-size: 17px; border: 0; border-radius: 8px; background: #33405a; color: #fff; }
.smallBtns button + button { margin-left: 4%; background: #8a2b2b; }
#teamHead { text-align: center; margin-bottom: 14px; }
#teamHead .d { color: #9fb0c8; font-size: 16px; }
#teamHead .sc { font-size: 26px; font-weight: bold; margin-top: 6px; }
#teamHead .sc b { display: inline-block; min-width: 54px; padding: 4px 10px; margin: 0 10px; border-radius: 8px; background: #0f141d; }
.prow { display: block; width: 100%; overflow: hidden; margin-bottom: 8px; padding: 12px 12px; text-align: left; border: 2px solid #33405a;
  border-radius: 10px; background: #0f141d; color: #fff; font-size: 19px; }
.prow .pn { float: left; width: 34px; color: #9fb0c8; }
.prow .pl { float: left; width: 64px; font-weight: bold; }
.prow .pm { float: left; width: 55%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.prow .ps { float: right; color: #9fb0c8; font-size: 17px; }
.prow.done { border-color: #1f5f3a; } .prow.done .ps { color: #6fdc9a; font-weight: bold; }
.prow.cur { border-color: #f5c400; } .prow.cur .ps { color: #f5c400; }
.prow.dbl .pl { width: 98px; }
.prow .pa { display: block; clear: both; padding: 4px 0 0 34px; font-size: 14px; color: #9fb0c8; }
.prow b.w { color: #6fdc9a; }

/* Fenêtre de lancement d'une partie */
.overlay label { display: block; text-align: left; font-size: 17px; color: #9fb0c8; margin: 14px 0 6px; }
.overlay .choice { margin-top: 0; padding: 12px 0; font-size: 18px; }
.choices.four .choice { width: 23.5%; margin-right: 2%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.choices.four .choice:last-child { margin-right: 0; }

/* ---------- Tableau de score ---------- */
#board { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
#topbar { position: absolute; top: 0; left: 0; right: 0; height: 64px; background: #0a0d13; padding: 8px 8px; white-space: nowrap; overflow: hidden; }
#topbar button { height: 48px; padding: 0 14px; margin-right: 6px; font-size: 17px; border: 0; border-radius: 8px; background: #2a3448; color: #fff; }
#topbar button.red { background: #8a2b2b; }
#matchInfo { float: right; line-height: 48px; font-size: 16px; color: #9fb0c8; padding-right: 6px; }

#panels { position: absolute; top: 64px; left: 0; right: 0; bottom: 56px; }
.panel { position: absolute; top: 0; bottom: 0; width: 50%; overflow: hidden; text-align: center; }
.panel.left { left: 0; }
.panel.right { left: 50%; border-left: 3px solid #0a0d13; }
.panel.p0 { background: #1d4fa8; }
.panel.p1 { background: #b0322f; }
.panel.pressed { opacity: 0.85; }
.pname { position: absolute; top: 14px; left: 70px; right: 70px; font-size: 30px; font-weight: bold; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; }
.serve { position: absolute; top: 18px; width: 28px; height: 28px; border-radius: 14px; background: #fff;
  box-shadow: 0 0 0 4px rgba(255,255,255,0.35); }
.panel.left .serve { left: 22px; }
.panel.right .serve { right: 22px; }
.serveText { position: absolute; top: 56px; left: 0; right: 0; font-size: 17px; color: rgba(255,255,255,0.85); }
.points { position: absolute; left: 0; right: 0; font-weight: bold; line-height: 1; letter-spacing: -0.03em; }
.games { position: absolute; bottom: 14px; width: 74px; height: 74px; line-height: 74px; font-size: 46px; font-weight: bold;
  border-radius: 10px; background: rgba(0,0,0,0.35); }
.panel.left .games { right: 14px; }
.panel.right .games { left: 14px; }
.gamesLbl { position: absolute; bottom: 92px; width: 74px; font-size: 13px; color: rgba(255,255,255,0.8); }
.panel.left .gamesLbl { right: 14px; }
.panel.right .gamesLbl { left: 14px; }
.minus { position: absolute; bottom: 14px; width: 74px; height: 74px; font-size: 44px; line-height: 70px; border: 0; border-radius: 37px;
  background: rgba(0,0,0,0.3); color: #fff; }
.panel.left .minus { left: 14px; }
.panel.right .minus { right: 14px; }
.tmo { position: absolute; bottom: 30px; left: 50%; width: 140px; margin-left: -70px; height: 44px; font-size: 16px; border: 0;
  border-radius: 8px; background: rgba(0,0,0,0.3); color: #fff; }
.tmo.used { opacity: 0.35; }

#history { position: absolute; left: 0; right: 0; bottom: 0; height: 56px; background: #0a0d13; text-align: center;
  line-height: 56px; font-size: 22px; white-space: nowrap; overflow: hidden; color: #cfd8e6; }
#history span { display: inline-block; margin: 0 10px; padding: 0 12px; line-height: 38px; border-radius: 6px; background: #1b2230; }
#history b.w0 { color: #7fb0ff; } #history b.w1 { color: #ff8f8c; }

/* ---------- Superpositions ---------- */
.overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(5,8,12,0.82); z-index: 10; text-align: center; }
.overlay .card { position: absolute; top: 50%; left: 50%; width: 520px; margin-left: -260px; -webkit-transform: translateY(-50%); transform: translateY(-50%);
  background: #1b2230; border-radius: 16px; padding: 28px; }
.overlay h2 { margin: 0 0 10px; font-size: 34px; }
.overlay p { margin: 0 0 22px; font-size: 22px; color: #cfd8e6; }
.overlay button { display: block; width: 100%; padding: 16px; margin-top: 10px; font-size: 22px; border: 0; border-radius: 10px; background: #2a3448; color: #fff; }
.overlay button.go { background: #1fb85b; font-weight: bold; }
#tmoCount { font-size: 120px; font-weight: bold; margin: 10px 0 20px; }
#toast { position: absolute; top: 90px; left: 50%; width: 420px; margin-left: -210px; padding: 16px; z-index: 20; border-radius: 12px;
  background: #f5c400; color: #000; font-size: 26px; font-weight: bold; text-align: center; }
@media (max-width: 600px) { .overlay .card { width: 92%; margin-left: -46%; } #toast { width: 92%; margin-left: -46%; } }

/* ---------- Téléphones, PC, navigateurs récents (ignoré sans risque par l'iPad 2) ---------- */
/* Ce bloc doit rester en fin de feuille pour l'emporter sur les règles de base. */
html, body { overscroll-behavior: none; }
#board { touch-action: none; }
.overlay .card { max-height: 94%; overflow-y: auto; -webkit-overflow-scrolling: touch; }

/* Écran étroit (téléphone) */
@media (max-width: 599px) {
  #topbar { height: 92px; }
  #topbar button { height: 44px; padding: 0 10px; margin-right: 4px; font-size: 15px; }
  #matchInfo { float: none; display: block; line-height: 30px; font-size: 14px; padding: 2px 4px 0; }
  #panels { top: 92px; }
  #history { font-size: 18px; } #history span { margin: 0 4px; padding: 0 8px; }
  .overlay h2 { font-size: 26px; } .overlay p { font-size: 19px; }
  .overlay .card { padding: 20px 16px; }
  #setup { padding: 12px 10px; } #setup .box { padding: 18px 14px; }
  #setup h1 { font-size: 26px; }
  .tab { font-size: 16px; }
  .teamCol { float: none; width: auto; } .teamCol + .teamCol { margin-left: 0; }
  .prow { font-size: 17px; padding: 12px 8px; } .prow .pm { width: 46%; } .prow .pl { width: 54px; }
  .prow .pn { width: 28px; } .prow.dbl .pl { width: 82px; } .prow.dbl .pm { width: 34%; }
  #teamHead .sc { font-size: 20px; } #teamHead .sc b { min-width: 40px; margin: 0 6px; }
}
/* Téléphone tenu en hauteur : joueurs l'un au-dessus de l'autre */
@media (max-width: 599px) and (orientation: portrait) {
  .panel { width: 100%; }
  .panel.left { top: 0; bottom: 50%; }
  .panel.right { top: 50%; bottom: 0; left: 0; border-left: 0; border-top: 3px solid #0a0d13; }
}
/* Écran bas (téléphone en largeur) */
@media (max-height: 500px) {
  #topbar { height: 52px; padding: 4px 8px; }
  #topbar button { height: 44px; }
  #matchInfo { line-height: 44px; }
  #panels { top: 52px; bottom: 40px; }
  #history { height: 40px; line-height: 40px; font-size: 18px; } #history span { line-height: 30px; }
  .games, .minus { width: 56px; height: 56px; line-height: 56px; font-size: 34px; bottom: 8px; }
  .minus { line-height: 52px; border-radius: 28px; }
  .gamesLbl { bottom: 66px; width: 56px; }
  .tmo { bottom: 14px; width: 120px; height: 40px; margin-left: -60px; font-size: 14px; }
  .pname { top: 8px; font-size: 24px; } .serve { top: 10px; } .serveText { top: 40px; font-size: 15px; }
}
</style>
</head>
<body>

<!-- Configuration -->
<div id="setup">
  <div class="box">
    <h1>&#127955; Tennis de table</h1>
    <div class="tabs">
      <button class="tab" id="tabSimple">Match simple</button>
      <button class="tab" id="tabTeam">Rencontre par équipes</button>
    </div>

    <!-- Rencontre par équipes -->
    <div id="teamSec" class="hidden">
      <div id="teamForm">
        <label for="tDate">Journée (date de la rencontre)</label>
        <input type="date" id="tDate">
        <div class="teamCols">
          <div class="teamCol">
            <label for="tClub1" class="c1">Club recevant</label>
            <input type="text" id="tClub1" class="pl" maxlength="30" placeholder="Nom du club" autocomplete="off" autocorrect="off">
            <div class="plRow"><span class="lt">A</span><input type="text" class="pl" id="tA0" maxlength="20" autocomplete="off" autocorrect="off"></div>
            <div class="plRow"><span class="lt">B</span><input type="text" class="pl" id="tA1" maxlength="20" autocomplete="off" autocorrect="off"></div>
            <div class="plRow"><span class="lt">C</span><input type="text" class="pl" id="tA2" maxlength="20" autocomplete="off" autocorrect="off"></div>
            <div class="plRow"><span class="lt">D</span><input type="text" class="pl" id="tA3" maxlength="20" autocomplete="off" autocorrect="off"></div>
          </div>
          <div class="teamCol">
            <label for="tClub2" class="c2">Club visiteur</label>
            <input type="text" id="tClub2" class="pl" maxlength="30" placeholder="Nom du club" autocomplete="off" autocorrect="off">
            <div class="plRow"><span class="lt">W</span><input type="text" class="pl" id="tB0" maxlength="20" autocomplete="off" autocorrect="off"></div>
            <div class="plRow"><span class="lt">X</span><input type="text" class="pl" id="tB1" maxlength="20" autocomplete="off" autocorrect="off"></div>
            <div class="plRow"><span class="lt">Y</span><input type="text" class="pl" id="tB2" maxlength="20" autocomplete="off" autocorrect="off"></div>
            <div class="plRow"><span class="lt">Z</span><input type="text" class="pl" id="tB3" maxlength="20" autocomplete="off" autocorrect="off"></div>
          </div>
        </div>
        <label>Parties en</label>
        <div class="choices" id="bestOfT">
          <button class="choice" data-v="3">3 manches</button>
          <button class="choice on" data-v="5">5 manches</button>
          <button class="choice" data-v="7">7 manches</button>
        </div>
        <button class="bigBtn" id="tCreate">Créer la rencontre</button>
      </div>
      <div id="teamView" class="hidden">
        <div id="teamHead"></div>
        <div id="partieList"></div>
        <div class="smallBtns">
          <button id="tEdit">&#9998; Modifier les noms</button>
          <button id="tEnd">Terminer la rencontre</button>
        </div>
      </div>
    </div>

    <!-- Match simple -->
    <div id="simpleSec">
    <label for="n0">Joueur 1 (bleu)</label>
    <input type="text" id="n0" value="Joueur 1" maxlength="20" autocomplete="off" autocorrect="off">
    <label for="n1">Joueur 2 (rouge)</label>
    <input type="text" id="n1" value="Joueur 2" maxlength="20" autocomplete="off" autocorrect="off">
    <label>Match en</label>
    <div class="choices" id="bestOf">
      <button class="choice" data-v="3">3 manches</button>
      <button class="choice on" data-v="5">5 manches</button>
      <button class="choice" data-v="7">7 manches</button>
    </div>
    <label>Premier serveur</label>
    <div class="choices two" id="firstServ">
      <button class="choice on" data-v="0" id="fs0">Joueur 1</button>
      <button class="choice" data-v="1" id="fs1">Joueur 2</button>
    </div>
    <button id="startBtn">Commencer le match</button>
    <button id="resumeBtn" class="hidden">Reprendre le match en cours</button>
    </div>
    <div id="online">
      <div id="syncStatus"></div>
      <a id="resultsLink" href="resultats.html">&#128203; Résultats et matchs en direct</a>
    </div>
  </div>
</div>

<!-- Tableau -->
<div id="board" class="hidden">
  <div id="topbar">
    <button id="undoBtn">&#8630; Annuler</button>
    <button id="swapBtn">&#8644; Côtés</button>
    <button id="newBtn" class="red">Nouveau match</button>
    <span id="matchInfo"></span>
  </div>
  <div id="panels">
    <div class="panel left" id="panelL">
      <div class="serve"></div><div class="pname"></div><div class="serveText"></div>
      <div class="points">0</div>
      <div class="gamesLbl">Manches</div><div class="games">0</div>
      <button class="minus">&minus;</button>
      <button class="tmo">Temps mort</button>
    </div>
    <div class="panel right" id="panelR">
      <div class="serve"></div><div class="pname"></div><div class="serveText"></div>
      <div class="points">0</div>
      <div class="gamesLbl">Manches</div><div class="games">0</div>
      <button class="minus">&minus;</button>
      <button class="tmo">Temps mort</button>
    </div>
  </div>
  <div id="history"></div>
</div>

<div id="gameOver" class="overlay hidden"><div class="card">
  <h2 id="goTitle"></h2><p id="goText"></p>
  <button class="go" id="nextBtn">Manche suivante</button>
  <button id="goUndo">&#8630; Annuler le dernier point</button>
</div></div>

<div id="tmoOverlay" class="overlay hidden"><div class="card">
  <h2 id="tmoTitle">Temps mort</h2>
  <div id="tmoCount">60</div>
  <button class="go" id="tmoEnd">Reprendre le jeu</button>
</div></div>

<div id="partieOv" class="overlay hidden"><div class="card">
  <h2 id="pvTitle"></h2><p id="pvText" style="white-space: pre-line"></p>
  <div id="pvDouble">
    <label id="pvL1" class="c1"></label>
    <div class="choices four" id="dbl1"><button class="choice" data-i="0"></button><button class="choice" data-i="1"></button><button class="choice" data-i="2"></button><button class="choice" data-i="3"></button></div>
    <label id="pvL2" class="c2"></label>
    <div class="choices four" id="dbl2"><button class="choice" data-i="0"></button><button class="choice" data-i="1"></button><button class="choice" data-i="2"></button><button class="choice" data-i="3"></button></div>
  </div>
  <div id="pvServe">
    <label>Premier serveur</label>
    <div class="choices two" id="pvFs"><button class="choice on" data-v="0"></button><button class="choice" data-v="1"></button></div>
  </div>
  <button class="go" id="pvGo">Commencer la partie</button>
  <button id="pvCancel">Annuler</button>
</div></div>

<div id="confirmEnd" class="overlay hidden"><div class="card">
  <h2>Terminer la rencontre ?</h2><p>La liste des parties sera effacée de l'iPad. Les résultats déjà enregistrés en ligne restent consultables.</p>
  <button class="go" id="ceYes">Oui, terminer</button>
  <button id="ceNo">Non</button>
</div></div>

<div id="confirmNew" class="overlay hidden"><div class="card">
  <h2 id="cnTitle">Nouveau match ?</h2><p id="cnText">Le match en cours sera effacé.</p>
  <button class="go" id="cnYes">Oui, nouveau match</button>
  <button id="cnNo">Non, continuer</button>
</div></div>

<div id="toast" class="hidden"></div>

<script src="config.js"></script>
<script>
// ES5 uniquement (Safari 9) : pas de let/const, pas de fonctions fléchées, pas de template strings.
(function () {
  'use strict';
  var KEY = 'ttScore.v1';
  var S = null;          // état du match
  var undoStack = [];
  var tmoTimer = null, toastTimer = null;

  function $(id) { return document.getElementById(id); }
  function q(el, sel) { return el.querySelector(sel); }
  function show(el) { el.classList.remove('hidden'); }
  function hide(el) { el.classList.add('hidden'); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  // Tap rapide : touchstart sur iPad, click à la souris
  function tap(el, fn) {
    var touched = false;
    el.addEventListener('touchstart', function (e) { touched = true; e.preventDefault(); e.stopPropagation(); fn(e); }, false);
    el.addEventListener('click', function (e) { if (touched) { touched = false; return; } e.stopPropagation(); fn(e); }, false);
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ s: S, u: undoStack.slice(-200) })); } catch (e) {}
    if (S) sendLive();
  }
  function load() {
    try { var d = JSON.parse(localStorage.getItem(KEY)); if (d && d.s) { S = d.s; undoStack = d.u || []; return true; } } catch (e) {}
    return false;
  }

  // ---------- Règles ----------
  function needed() { return Math.floor(S.bestOf / 2) + 1; }
  function isDeciding() { return S.gameIndex === S.bestOf - 1; }
  function server() {
    // Celui qui a servi en premier dans une manche reçoit en premier dans la suivante.
    var first = (S.firstServer + S.gameIndex) % 2;
    var t = S.points[0] + S.points[1];
    var k = t < 20 ? Math.floor(t / 2) : t - 10; // 2 services chacun, puis 1 à partir de 10-10
    return (first + k) % 2;
  }
  function gameWon() {
    var a = S.points[0], b = S.points[1];
    if (a >= 11 && a - b >= 2) return 0;
    if (b >= 11 && b - a >= 2) return 1;
    return -1;
  }

  function pushUndo() { undoStack.push(clone(S)); if (undoStack.length > 300) undoStack.shift(); }

  function addPoint(p) {
    if (S.pending !== null || S.finished) return;
    pushUndo();
    S.points[p]++;
    var w = gameWon();
    if (w >= 0) {
      S.games[w]++;
      S.history.push([S.points[0], S.points[1]]);
      S.pending = w;
      if (S.games[w] >= needed()) S.finished = true;
    } else if (isDeciding() && !S.decSwapped && (S.points[0] === 5 || S.points[1] === 5)) {
      S.decSwapped = true;
      S.swapped = !S.swapped;
      toast('Changement de côté !');
    }
    save(); render();
  }

  function removePoint(p) {
    if (S.pending !== null || S.points[p] <= 0) return;
    pushUndo();
    S.points[p]--;
    save(); render();
  }

  function undo() {
    if (!undoStack.length) { toast('Rien à annuler'); return; }
    S = undoStack.pop();
    save(); render();
  }

  function nextGame() {
    if (S.finished) return;
    pushUndo();
    S.points = [0, 0];
    S.gameIndex++;
    S.pending = null;
    S.swapped = !S.swapped; // on change de côté à chaque manche
    S.decSwapped = false;
    save(); render();
  }

  // ---------- Affichage ----------
  // Taille des chiffres calculée d'après chaque panneau (côte à côte ou l'un sur l'autre)
  function sizeFonts() {
    var ids = ['panelL', 'panelR'];
    for (var i = 0; i < ids.length; i++) {
      var el = $(ids[i]), h = el.offsetHeight, w = el.offsetWidth;
      var fs = Math.min(h * 0.52, w * 0.62), pt = q(el, '.points');
      pt.style.fontSize = Math.round(fs) + 'px';
      pt.style.top = Math.round(h * 0.47 - fs * 0.5) + 'px';
    }
  }

  function fillPanel(el, p) {
    el.className = 'panel ' + (el.id === 'panelL' ? 'left' : 'right') + ' p' + p;
    el.setAttribute('data-p', p);
    q(el, '.pname').textContent = S.names[p];
    q(el, '.points').textContent = S.points[p];
    q(el, '.games').textContent = S.games[p];
    var srv = S.pending === null && !S.finished && server() === p;
    q(el, '.serve').style.visibility = srv ? 'visible' : 'hidden';
    var t = S.points[0] + S.points[1];
    q(el, '.serveText').textContent = srv ? (t >= 20 ? 'Service (1 seul)' : (t % 2 === 0 ? 'Service 1/2' : 'Service 2/2')) : '';
    var tb = q(el, '.tmo');
    tb.className = 'tmo' + (S.timeouts[p] ? ' used' : '');
    tb.textContent = S.timeouts[p] ? 'Temps mort pris' : 'Temps mort';
  }

  function render() {
    var left = S.swapped ? 1 : 0;
    fillPanel($('panelL'), left);
    fillPanel($('panelR'), 1 - left);

    var a = S.points[0], b = S.points[1];
    var info = (S.renc ? 'Partie ' + (S.renc.idx + 1) + ' (' + S.renc.label + ')' + (S.renc.arb ? ' · Arb. ' + S.renc.arb : '') + ' · ' : '') +
      'Manche ' + (S.gameIndex + 1) + ' · en ' + S.bestOf;
    if (S.pending === null && !S.finished) {
      if ((a >= 10 || b >= 10) && Math.abs(a - b) === 1) info += ' · Balle de manche';
      if (a >= 10 && b >= 10 && a === b) info += ' · Égalité';
    }
    $('matchInfo').textContent = info;

    var h = '';
    for (var i = 0; i < S.history.length; i++) {
      var g = S.history[i], w = g[0] > g[1] ? 0 : 1;
      h += '<span>' + (w === 0 ? '<b class="w0">' + g[0] + '</b>' : g[0]) + ' – ' + (w === 1 ? '<b class="w1">' + g[1] + '</b>' : g[1]) + '</span>';
    }
    $('history').innerHTML = h || '<span style="background:none;color:#5c6b82">Scores des manches</span>';

    if (S.pending !== null) {
      var name = S.names[S.pending];
      var last = S.history[S.history.length - 1];
      if (S.finished) {
        $('goTitle').textContent = '🏆 ' + name + ' gagne le match !';
        $('goText').textContent = 'Manches ' + S.games[S.pending] + ' – ' + S.games[1 - S.pending] + '  (dernière : ' + last[0] + '-' + last[1] + ')';
        $('nextBtn').textContent = S.renc ? 'Enregistrer et retour à la rencontre' : 'Enregistrer et nouveau match';
      } else {
        $('goTitle').textContent = 'Manche pour ' + name;
        $('goText').textContent = last[0] + ' – ' + last[1] + '   ·   Manches : ' + S.games[0] + ' – ' + S.games[1];
        $('nextBtn').textContent = 'Manche suivante (changement de côté)';
      }
      show($('gameOver'));
    } else {
      hide($('gameOver'));
    }
    sizeFonts();
  }

  function toast(msg) {
    var t = $('toast');
    t.textContent = msg; show(t);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { hide(t); }, 2500);
  }

  // ---------- Enregistrement en ligne (file d'attente + JSONP, OK hors ligne) ----------
  var QKEY = 'ttScore.queue', jsonpN = 0, sending = false;

  function getQueue() { try { return JSON.parse(localStorage.getItem(QKEY)) || []; } catch (e) { return []; } }
  function setQueue(q) { try { localStorage.setItem(QKEY, JSON.stringify(q)); } catch (e) {} }
  function apiOk() { return typeof SCORE_API !== 'undefined' && !!SCORE_API; }

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function fmtDate(t) {
    var d = new Date(t);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  // Met le match terminé dans la file d'envoi (une seule fois)
  function queueFinished() {
    if (!S || !S.finished || S.saved) return;
    var w = S.games[0] > S.games[1] ? 0 : 1, det = [];
    for (var i = 0; i < S.history.length; i++) det.push(S.history[i][0] + '-' + S.history[i][1]);
    var rec = { id: S.id, date: fmtDate(S.startedAt), joueur1: S.names[0], joueur2: S.names[1],
             manches1: S.games[0], manches2: S.games[1], vainqueur: S.names[w], detail: det.join(' '),
             format: 'en ' + S.bestOf, duree_min: Math.round((Date.now() - S.startedAt) / 60000),
             journee: fmtDate(S.startedAt).slice(0, 10) };
    var R = loadRenc();
    if (S.renc && R && R.id === S.renc.id) {
      rec.rencontre_id = R.id; rec.journee = R.journee; rec.club1 = R.clubs[0]; rec.club2 = R.clubs[1];
      rec.partie = S.renc.label; rec.ordre = S.renc.idx + 1; rec.arbitre = S.renc.arb || '';
      R.res[S.renc.idx] = { g: [S.games[0], S.games[1]], detail: det.join(' '), n: [S.names[0], S.names[1]] };
      saveRenc(R);
    }
    var q = getQueue();
    q.push(rec);
    setQueue(q);
    S.saved = true; save();
    flushQueue();
  }

  function jsonp(params, cb) {
    var name = 'ttcb' + (++jsonpN) + '_' + Date.now(), s = document.createElement('script'), done = false, timer;
    var qs = [];
    params.callback = name;
    for (var k in params) if (params.hasOwnProperty(k)) qs.push(encodeURIComponent(k) + '=' + encodeURIComponent(params[k]));
    function finish(err, data) {
      if (done) return; done = true;
      clearTimeout(timer);
      window[name] = function () {};
      if (s.parentNode) s.parentNode.removeChild(s);
      cb(err, data);
    }
    window[name] = function (data) { finish(null, data); };
    s.onerror = function () { finish('reseau'); };
    timer = setTimeout(function () { finish('reseau'); }, 20000);
    s.src = SCORE_API + (SCORE_API.indexOf('?') < 0 ? '?' : '&') + qs.join('&');
    document.body.appendChild(s);
  }

  function setSync(msg, cls) { var el = $('syncStatus'); el.textContent = msg; el.className = cls || ''; }

  function syncText() {
    var n = getQueue().length;
    if (!n) { setSync('Tous les matchs sont enregistrés en ligne.', 'ok'); return; }
    var t = n + ' match' + (n > 1 ? 's' : '') + ' en attente d\'envoi.';
    if (!apiOk()) t += ' (Adresse du serveur non configurée)';
    setSync(t, '');
  }

  function flushQueue() {
    syncText();
    if (sending || !apiOk()) return;
    var q = getQueue();
    if (!q.length) return;
    sending = true;
    setSync('Envoi des résultats…', '');
    var rec = clone(q[0]);
    rec.action = 'add';
    jsonp(rec, function (err, data) {
      sending = false;
      if (err) { syncText(); setSync($('syncStatus').textContent + ' Pas de connexion, nouvel essai plus tard.', 'err'); return; }
      if (!data || !data.ok) { setSync('Erreur : ' + ((data && data.erreur) || 'inconnue'), 'err'); return; }
      var q2 = getQueue();
      if (q2.length && q2[0].id === q[0].id) q2.shift();
      setQueue(q2);
      if (q2.length) flushQueue(); else { syncText(); toast('Résultat enregistré en ligne ✓'); }
    });
  }

  // ---------- Score en direct : l'état du match est envoyé à chaque changement ----------
  // Un seul envoi à la fois ; les changements faits pendant un envoi partent juste après.
  var liveBusy = false, liveDirty = false, liveTimer = null;

  function livePayload() {
    var o = { n: S.names, p: S.points, g: S.games, h: S.history, bo: S.bestOf,
              sv: S.pending === null && !S.finished ? server() : -1, fin: S.finished ? 1 : 0 };
    var R = S.renc ? loadRenc() : null;
    if (R && R.id === S.renc.id) o.r = { id: R.id, c1: R.clubs[0], c2: R.clubs[1], l: S.renc.label, i: S.renc.idx, j: R.journee, a: S.renc.arb || '' };
    else o.j = fmtDate(S.startedAt).slice(0, 10);
    return o;
  }

  function sendLive() {
    if (!S || !apiOk()) return;
    if (liveBusy) { liveDirty = true; return; }
    liveBusy = true; liveDirty = false;
    jsonp({ action: 'live', id: S.id, etat: JSON.stringify(livePayload()) }, function () {
      liveBusy = false;
      if (liveDirty) { clearTimeout(liveTimer); liveTimer = setTimeout(sendLive, 800); }
    });
  }

  function stopLive(id) { if (id && apiOk()) jsonp({ action: 'stop', id: id }, function () {}); }

  // ---------- Temps mort ----------
  function startTimeout(p) {
    if (S.timeouts[p] || S.pending !== null) return;
    pushUndo();
    S.timeouts[p] = true; save(); render();
    var left = 60;
    $('tmoTitle').textContent = 'Temps mort – ' + S.names[p];
    $('tmoCount').textContent = left;
    show($('tmoOverlay'));
    clearInterval(tmoTimer);
    tmoTimer = setInterval(function () {
      left--; $('tmoCount').textContent = left;
      if (left <= 0) endTimeout();
    }, 1000);
  }
  function endTimeout() { clearInterval(tmoTimer); hide($('tmoOverlay')); }

  // ---------- Écran de configuration ----------
  function choiceGroup(id) {
    var btns = $(id).querySelectorAll('.choice');
    for (var i = 0; i < btns.length; i++) {
      (function (b) {
        tap(b, function () {
          for (var j = 0; j < btns.length; j++) btns[j].classList.remove('on');
          b.classList.add('on');
        });
      })(btns[i]);
    }
  }
  function choiceVal(id) { return parseInt(q($(id), '.choice.on').getAttribute('data-v'), 10); }

  function setChoice(id, v) {
    var btns = $(id).querySelectorAll('.choice');
    for (var i = 0; i < btns.length; i++) btns[i].classList[btns[i].getAttribute('data-v') === String(v) ? 'add' : 'remove']('on');
  }

  function openSetup() {
    endTimeout();
    hide($('board')); hide($('gameOver')); hide($('confirmNew'));
    if (S && !S.finished && !S.renc) show($('resumeBtn')); else hide($('resumeBtn'));
    show($('setup'));
    setMode(getMode());
    keepAwake(false);
    flushQueue();
  }
  function openBoard() { hide($('setup')); show($('board')); render(); keepAwake(true); if (!S.finished) sendLive(); }

  // Garde l'écran allumé pendant un match (téléphones/PC récents ; absent sur l'iPad 2)
  var wakeLock = null;
  function keepAwake(on) {
    if (!('wakeLock' in navigator)) return;
    if (on) {
      if (wakeLock) return;
      navigator.wakeLock.request('screen').then(function (l) {
        wakeLock = l;
        l.addEventListener('release', function () { wakeLock = null; });
      })['catch'](function () {});
    } else if (wakeLock) { wakeLock.release(); wakeLock = null; }
  }

  function trim(s) { return String(s).replace(/^\s+|\s+$/g, ''); }
  function newId(p) { return p + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36); }

  function newMatch(n0, n1, bestOf, firstServer) {
    if (document.activeElement) document.activeElement.blur();
    S = { id: newId(''), startedAt: Date.now(), saved: false,
          names: [n0, n1], bestOf: bestOf, firstServer: firstServer,
          points: [0, 0], games: [0, 0], gameIndex: 0, history: [], pending: null, finished: false,
          swapped: false, decSwapped: false, timeouts: [false, false] };
    undoStack = [];
  }

  function startMatch() {
    newMatch(trim($('n0').value) || 'Joueur 1', trim($('n1').value) || 'Joueur 2', choiceVal('bestOf'), choiceVal('firstServ'));
    save(); openBoard();
  }

  // ---------- Rencontre par équipes (4 contre 4) ----------
  var RKEY = 'ttScore.renc', MKEY = 'ttScore.mode', teamEditing = false, pvIdx = -1;
  var L1 = ['A', 'B', 'C', 'D'], L2 = ['W', 'X', 'Y', 'Z'];
  // Ordre officiel des parties : [joueur club 1, joueur club 2] ou double
  var ORDRE = [[0, 0], [1, 1], [2, 2], [3, 3], [0, 1], [1, 0], [3, 2], [2, 3], 'Double 1', 'Double 2', [0, 2], [2, 0], [3, 1], [1, 3]];
  // Arbitrage partagé : lettre du joueur qui arbitre chaque partie (aucun imposé pour les doubles)
  var ARBITRES = ['D', 'Z', 'B', 'W', 'C', 'Y', 'X', 'A', '', '', 'X', 'B', 'A', 'W'];

  function arbitre(R, i) {
    var l = ARBITRES[i], k = L1.indexOf(l);
    if (!l) return '';
    return (k >= 0 ? R.p1[k] : R.p2[L2.indexOf(l)]) + ' (' + l + ')';
  }

  function loadRenc() { try { return JSON.parse(localStorage.getItem(RKEY)); } catch (e) { return null; } }
  function saveRenc(R) { try { localStorage.setItem(RKEY, JSON.stringify(R)); } catch (e) {} }
  function getMode() { try { return localStorage.getItem(MKEY) || 'simple'; } catch (e) { return 'simple'; } }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function isDouble(i) { return typeof ORDRE[i] === 'string'; }
  function plabel(i) { return isDouble(i) ? ORDRE[i] : L1[ORDRE[i][0]] + L2[ORDRE[i][1]]; }
  function frDay(d) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d || ''); return m ? m[3] + '/' + m[2] + '/' + m[1] : d; }

  function partieNames(R, i) {
    if (!isDouble(i)) return [R.p1[ORDRE[i][0]], R.p2[ORDRE[i][1]]];
    var d = R.dbl[i === 8 ? 0 : 1];
    if (!d) return null;
    return [R.p1[d.a[0]] + ' / ' + R.p1[d.a[1]], R.p2[d.b[0]] + ' / ' + R.p2[d.b[1]]];
  }

  function teamScore(R) {
    var s = [0, 0];
    for (var i = 0; i < R.res.length; i++) if (R.res[i]) s[R.res[i].g[0] > R.res[i].g[1] ? 0 : 1]++;
    return s;
  }

  function setMode(m) {
    try { localStorage.setItem(MKEY, m); } catch (e) {}
    $('tabSimple').className = 'tab' + (m === 'simple' ? ' on' : '');
    $('tabTeam').className = 'tab' + (m === 'team' ? ' on' : '');
    $('simpleSec').className = m === 'simple' ? '' : 'hidden';
    $('teamSec').className = m === 'team' ? '' : 'hidden';
    $('setup').className = m === 'team' ? 'wide' : '';
    if (m === 'team') renderTeam();
  }

  function fillTeamForm(R) {
    $('tDate').value = R ? R.journee : fmtDate(Date.now()).slice(0, 10);
    $('tClub1').value = R ? R.clubs[0] : '';
    $('tClub2').value = R ? R.clubs[1] : '';
    for (var i = 0; i < 4; i++) { $('tA' + i).value = R ? R.p1[i] : ''; $('tB' + i).value = R ? R.p2[i] : ''; }
    setChoice('bestOfT', R ? R.bestOf : 5);
    $('tCreate').textContent = R ? 'Valider les noms' : 'Créer la rencontre';
  }

  function renderTeam() {
    var R = loadRenc();
    if (!R || teamEditing) { show($('teamForm')); hide($('teamView')); return; }
    hide($('teamForm')); show($('teamView'));
    var sc = teamScore(R);
    $('teamHead').innerHTML = '<div class="d">Journée du ' + esc(frDay(R.journee)) + ' · parties en ' + R.bestOf + ' manches</div>' +
      '<div class="sc"><span class="c1">' + esc(R.clubs[0]) + '</span><b>' + sc[0] + '</b>–<b>' + sc[1] + '</b><span class="c2">' + esc(R.clubs[1]) + '</span></div>';
    var list = $('partieList');
    list.innerHTML = '';
    for (var i = 0; i < ORDRE.length; i++) {
      var res = R.res[i], names = partieNames(R, i);
      var cur = S && !S.finished && S.renc && S.renc.id === R.id && S.renc.idx === i;
      var b = document.createElement('button');
      b.className = 'prow' + (isDouble(i) ? ' dbl' : '') + (res ? ' done' : '') + (cur ? ' cur' : '');
      var nm;
      if (res) {
        var w = res.g[0] > res.g[1] ? 0 : 1;
        nm = (w === 0 ? '<b class="w">' + esc(res.n[0]) + '</b>' : esc(res.n[0])) + ' – ' + (w === 1 ? '<b class="w">' + esc(res.n[1]) + '</b>' : esc(res.n[1]));
      } else nm = names ? esc(names[0]) + ' – ' + esc(names[1]) : '<span style="color:#9fb0c8">joueurs à choisir</span>';
      b.innerHTML = '<span class="pn">' + (i + 1) + '.</span><span class="pl">' + plabel(i).replace(/^([A-D])([W-Z])$/, '$1 – $2') + '</span>' +
        '<span class="pm">' + nm + '</span><span class="ps">' + (res ? res.g[0] + ' – ' + res.g[1] : cur ? 'en cours ▶' : 'à jouer') + '</span>' +
        (ARBITRES[i] ? '<span class="pa">Arbitre : ' + esc(arbitre(R, i)) + '</span>' : '');
      // click (et non tap) pour laisser défiler la liste au doigt
      (function (idx) { b.addEventListener('click', function () { openPartie(idx); }, false); })(i);
      list.appendChild(b);
    }
  }

  function saveTeamForm() {
    if (document.activeElement) document.activeElement.blur();
    var R = loadRenc() || { id: newId('r'), res: [], dbl: [null, null] };
    R.journee = $('tDate').value || fmtDate(Date.now()).slice(0, 10);
    R.clubs = [trim($('tClub1').value) || 'Club 1', trim($('tClub2').value) || 'Club 2'];
    R.p1 = []; R.p2 = [];
    for (var i = 0; i < 4; i++) { R.p1.push(trim($('tA' + i).value) || L1[i]); R.p2.push(trim($('tB' + i).value) || L2[i]); }
    R.bestOf = choiceVal('bestOfT');
    for (i = 0; i < ORDRE.length; i++) if (R.res[i] === undefined) R.res[i] = null;
    saveRenc(R);
    teamEditing = false;
    renderTeam();
  }

  function selected(id) {
    var out = [], btns = $(id).querySelectorAll('.choice');
    for (var i = 0; i < btns.length; i++) if (btns[i].classList.contains('on')) out.push(i);
    return out;
  }

  function openPartie(i) {
    var R = loadRenc();
    if (S && !S.finished) {
      if (S.renc && S.renc.id === R.id && S.renc.idx === i) { openBoard(); return; }
      toast(S.renc ? 'Partie ' + (S.renc.idx + 1) + ' en cours : terminez-la ou abandonnez-la' : 'Un match simple est en cours');
      return;
    }
    pvIdx = i;
    var names = partieNames(R, i), res = R.res[i];
    $('pvTitle').textContent = 'Partie ' + (i + 1) + ' · ' + plabel(i);
    var t = '';
    if (isDouble(i)) {
      show($('pvDouble'));
      $('pvL1').textContent = R.clubs[0] + ' : choisir 2 joueurs';
      $('pvL2').textContent = R.clubs[1] + ' : choisir 2 joueurs';
      var d = R.dbl[i === 8 ? 0 : 1];
      for (var k = 0; k < 4; k++) {
        var b1 = $('dbl1').children[k], b2 = $('dbl2').children[k];
        b1.textContent = L1[k] + ' ' + R.p1[k]; b2.textContent = L2[k] + ' ' + R.p2[k];
        b1.className = 'choice' + (d && d.a.indexOf(k) >= 0 ? ' on' : '');
        b2.className = 'choice' + (d && d.b.indexOf(k) >= 0 ? ' on' : '');
      }
      $('pvFs').children[0].textContent = R.clubs[0]; $('pvFs').children[1].textContent = R.clubs[1];
    } else {
      hide($('pvDouble'));
      t = names[0] + '  –  ' + names[1];
      $('pvFs').children[0].textContent = names[0]; $('pvFs').children[1].textContent = names[1];
    }
    if (res) t += (t ? '\n' : '') + 'Déjà jouée (' + res.g[0] + ' – ' + res.g[1] + '). La rejouer remplacera ce résultat.';
    if (ARBITRES[i]) t += (t ? '\n' : '') + 'Arbitre : ' + arbitre(R, i);
    $('pvText').textContent = t;
    $('pvGo').textContent = res ? 'Rejouer la partie' : 'Commencer la partie';
    setChoice('pvFs', 0);
    show($('partieOv'));
  }

  function startPartie() {
    var R = loadRenc(), i = pvIdx, names;
    if (!R || i < 0) return;
    if (isDouble(i)) {
      var a = selected('dbl1'), b = selected('dbl2');
      if (a.length !== 2 || b.length !== 2) { toast('Choisissez 2 joueurs par club'); return; }
      R.dbl[i === 8 ? 0 : 1] = { a: a, b: b };
      saveRenc(R);
    }
    names = partieNames(R, i);
    newMatch(names[0], names[1], R.bestOf, choiceVal('pvFs'));
    S.renc = { id: R.id, idx: i, label: plabel(i), arb: arbitre(R, i) };
    save();
    hide($('partieOv'));
    openBoard();
  }

  function updateServerLabels() {
    $('fs0').textContent = $('n0').value || 'Joueur 1';
    $('fs1').textContent = $('n1').value || 'Joueur 2';
  }

  // ---------- Branchements ----------
  choiceGroup('bestOf'); choiceGroup('firstServ');
  $('n0').addEventListener('input', updateServerLabels, false);
  $('n1').addEventListener('input', updateServerLabels, false);
  tap($('startBtn'), startMatch);
  tap($('resumeBtn'), function () { if (document.activeElement) document.activeElement.blur(); openBoard(); });

  ['panelL', 'panelR'].forEach(function (id) {
    var el = $(id);
    tap(el, function () {
      el.classList.add('pressed');
      setTimeout(function () { el.classList.remove('pressed'); }, 120);
      addPoint(parseInt(el.getAttribute('data-p'), 10));
    });
    tap(q(el, '.minus'), function () { removePoint(parseInt(el.getAttribute('data-p'), 10)); });
    tap(q(el, '.tmo'), function () { startTimeout(parseInt(el.getAttribute('data-p'), 10)); });
  });

  tap($('undoBtn'), undo);
  tap($('goUndo'), undo);
  tap($('swapBtn'), function () { S.swapped = !S.swapped; save(); render(); });
  function onNext() { if (S.finished) { queueFinished(); openSetup(); } else { nextGame(); } }
  tap($('nextBtn'), onNext);
  tap($('newBtn'), function () {
    if (S.finished) { queueFinished(); openSetup(); return; }
    $('cnTitle').textContent = S.renc ? 'Abandonner la partie ?' : 'Nouveau match ?';
    $('cnText').textContent = S.renc ? 'Le score de cette partie sera effacé (rien n\'est enregistré).' : 'Le match en cours sera effacé.';
    $('cnYes').textContent = S.renc ? 'Oui, retour à la rencontre' : 'Oui, nouveau match';
    show($('confirmNew'));
  });

  // Rencontre par équipes
  tap($('tabSimple'), function () { setMode('simple'); });
  tap($('tabTeam'), function () { setMode('team'); });
  choiceGroup('bestOfT'); choiceGroup('pvFs');
  ['dbl1', 'dbl2'].forEach(function (id) {
    var btns = $(id).querySelectorAll('.choice');
    for (var i = 0; i < btns.length; i++) {
      (function (b) {
        tap(b, function () {
          if (!b.classList.contains('on') && selected(id).length >= 2) { toast('2 joueurs maximum'); return; }
          b.classList.toggle('on');
        });
      })(btns[i]);
    }
  });
  tap($('tCreate'), saveTeamForm);
  tap($('tEdit'), function () { teamEditing = true; fillTeamForm(loadRenc()); renderTeam(); });
  tap($('tEnd'), function () { show($('confirmEnd')); });
  tap($('ceNo'), function () { hide($('confirmEnd')); });
  tap($('ceYes'), function () {
    hide($('confirmEnd'));
    try { localStorage.removeItem(RKEY); } catch (e) {}
    if (S && S.renc && !S.finished) { stopLive(S.id); S = null; undoStack = []; try { localStorage.removeItem(KEY); } catch (e) {} }
    teamEditing = false; fillTeamForm(null); renderTeam();
  });
  tap($('pvGo'), startPartie);
  tap($('pvCancel'), function () { hide($('partieOv')); });
  fillTeamForm(loadRenc());
  window.addEventListener('online', function () { flushQueue(); if (S && !S.finished) sendLive(); }, false);
  tap($('cnYes'), function () {
    hide($('confirmNew'));
    if (S && !S.renc) { $('n0').value = S.names[0]; $('n1').value = S.names[1]; updateServerLabels(); }
    if (S) stopLive(S.id);
    S = null; undoStack = []; try { localStorage.removeItem(KEY); } catch (e) {}
    openSetup();
  });
  tap($('cnNo'), function () { hide($('confirmNew')); });
  tap($('tmoEnd'), endTimeout);

  // Empêche le défilement / rebond de la page sur le tableau (sauf dans une fenêtre qui défile).
  // Les navigateurs récents exigent { passive: false } ; l'iPad 2 reçoit simplement false.
  var passiveOk = false;
  try { window.addEventListener('test', null, Object.defineProperty({}, 'passive', { get: function () { passiveOk = true; } })); } catch (e) {}
  document.addEventListener('touchmove', function (e) {
    if (!$('setup').classList.contains('hidden')) return;
    for (var t = e.target; t && t !== document; t = t.parentNode) if (t.classList && t.classList.contains('card')) return;
    e.preventDefault();
  }, passiveOk ? { passive: false } : false);

  // Clavier (PC) : ← / → point au joueur de gauche / droite, Maj+flèche pour retirer,
  // Retour arrière ou Ctrl+Z pour annuler, Entrée / Espace pour continuer, Échap pour fermer.
  document.addEventListener('keydown', function (e) {
    var tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select' || !S || $('board').classList.contains('hidden')) return;
    var c = e.keyCode, handled = true;
    var overlay = !$('gameOver').classList.contains('hidden');
    if (c === 27) { endTimeout(); hide($('confirmNew')); }
    else if (!$('tmoOverlay').classList.contains('hidden') && (c === 13 || c === 32)) endTimeout();
    else if (c === 8 || (c === 90 && (e.ctrlKey || e.metaKey))) undo();
    else if (overlay && (c === 13 || c === 32)) onNext();
    else if (!overlay && (c === 37 || c === 39)) {
      var p = parseInt($(c === 37 ? 'panelL' : 'panelR').getAttribute('data-p'), 10);
      if (e.shiftKey) removePoint(p); else addPoint(p);
    } else handled = false;
    if (handled) e.preventDefault();
  }, false);

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && !$('board').classList.contains('hidden')) keepAwake(true);
  }, false);

  // Fonctionne hors ligne sur les appareils récents (l'iPad 2 n'a pas de service worker)
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js')['catch'](function () {});
  }
  window.addEventListener('resize', function () { if (S) sizeFonts(); }, false);
  window.addEventListener('orientationchange', function () { setTimeout(function () { if (S) sizeFonts(); }, 300); }, false);

  if (load()) {
    if (!S.renc) { $('n0').value = S.names[0]; $('n1').value = S.names[1]; updateServerLabels(); }
    if (!S.id) { S.id = 'm' + Date.now().toString(36); S.startedAt = Date.now(); }
    if (S.finished) { queueFinished(); openSetup(); } else openBoard();
  } else {
    openSetup();
  }
})();
</script>
</body>
</html>
