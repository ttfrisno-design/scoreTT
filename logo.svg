<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <title>Score TT</title>
  <!-- Fond sombre de l'application, liseré bleu / rouge en bas (couleurs du tableau) -->
  <defs>
    <clipPath id="coins"><rect width="100" height="100" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#coins)">
    <rect width="100" height="100" fill="#1b2230"/>
    <rect y="90" width="50" height="10" fill="#1d4fa8"/>
    <rect x="50" y="90" width="50" height="10" fill="#b0322f"/>
  </g>
  <!-- Raquette : manche en bois évasé, bord bois, revêtement rouge -->
  <g transform="translate(42 40) rotate(-40)">
    <path d="M-9 22 L9 22 L7 30 L7 52 Q7 56 3 56 L-3 56 Q-7 56 -7 52 L-7 30 Z" fill="#c9965a"/>
    <rect x="-7" y="36" width="14" height="3" fill="#a8743f"/>
    <rect x="-7" y="44" width="14" height="3" fill="#a8743f"/>
    <ellipse rx="27" ry="30" fill="#d9b07a"/>
    <ellipse rx="25" ry="28" fill="#e03a32"/>
  </g>
  <!-- Balle -->
  <circle cx="80" cy="22" r="9" fill="#ffffff"/>
</svg>
