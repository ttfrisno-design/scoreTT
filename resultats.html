<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Résultats Ping-Pong</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#10141c">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Compatible Safari 9 (iPad 2) : pas de grid, pas de variables CSS */
* { -webkit-box-sizing: border-box; box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #10141c; color: #fff; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
a { color: inherit; text-decoration: none; }
.wrap { max-width: 980px; margin: 0 auto; padding: 20px 16px 40px; }
h1 { margin: 0 0 16px; font-size: 28px; }
h1 .logo { width: 40px; height: 40px; margin-right: 12px; vertical-align: middle; border-radius: 9px; }
h2 { margin: 6px 0 14px; font-size: 22px; color: #cfd8e6; font-weight: normal; }
.bar { overflow: hidden; margin-bottom: 14px; }
.bar a, .bar button { float: left; margin: 0 8px 8px 0; padding: 12px 16px; font-size: 17px; color: #fff; background: #2a3448;
  border: 0; border-radius: 8px; font-family: inherit; }
#status { color: #9fb0c8; font-size: 16px; margin: 4px 0 14px; }
#status.err { color: #ff8f8c; }
.c1 { color: #7fb0ff; } .c2 { color: #ff8f8c; }

/* Listes cliquables (journées, rencontres) */
.item { display: block; overflow: hidden; background: #1b2230; border-radius: 12px; padding: 16px 18px; margin-bottom: 10px; font-size: 21px; }
.item .sub { display: block; margin-top: 4px; font-size: 15px; color: #9fb0c8; }
.item .go { float: right; color: #5c6b82; font-size: 26px; line-height: 1; margin-top: 6px; }
.item .score b { display: inline-block; min-width: 40px; text-align: center; padding: 2px 8px; margin: 0 8px; border-radius: 6px; background: #10141c; }

/* Rencontre */
.teamHead { text-align: center; background: #1b2230; border-radius: 14px; padding: 18px; margin-bottom: 16px; }
.teamHead .sc { font-size: 28px; font-weight: bold; }
.teamHead .sc b { display: inline-block; min-width: 60px; padding: 4px 12px; margin: 0 12px; border-radius: 8px; background: #10141c; font-size: 34px; }
.teamHead .sub { color: #9fb0c8; font-size: 15px; margin-top: 8px; }

.match { background: #1b2230; border-radius: 12px; padding: 12px 16px; margin-bottom: 10px; }
.top { overflow: hidden; color: #9fb0c8; font-size: 14px; margin-bottom: 6px; }
.top .r { float: right; }
.top .lbl { color: #fff; font-weight: bold; font-size: 16px; margin-right: 8px; }
.row { overflow: hidden; font-size: 20px; line-height: 32px; }
.row .n { float: left; width: 55%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.row .g { float: left; width: 36px; text-align: center; font-weight: bold; border-radius: 6px; background: #10141c; }
.row .d { float: left; padding-left: 10px; color: #cfd8e6; font-size: 17px; }
.row.win .n { font-weight: bold; }
.row.win .n:after { content: " \2714"; color: #6fdc9a; font-size: 17px; }
.empty { padding: 30px; text-align: center; color: #5c6b82; font-size: 18px; }
.del { float: right; margin: -2px 0 0 10px; padding: 3px 9px; font-size: 14px; border: 0; border-radius: 6px;
  background: #3a2228; color: #ff8f8c; font-family: inherit; cursor: pointer; }
.delR { display: inline-block; margin-top: 12px; padding: 8px 14px; font-size: 15px; border: 0; border-radius: 8px;
  background: #3a2228; color: #ff8f8c; font-family: inherit; cursor: pointer; }
.note { color: #5c6b82; font-size: 14px; margin-top: 18px; }

.bilan { overflow: hidden; margin-top: 22px; }
.bilan .col { float: left; width: 48%; } .bilan .col + .col { margin-left: 4%; }
.bilan h3 { margin: 0 0 8px; font-size: 18px; }
.bilan .p { overflow: hidden; background: #1b2230; border-radius: 8px; padding: 8px 12px; margin-bottom: 6px; font-size: 17px; }
.bilan .p span { float: right; color: #9fb0c8; }
@media (max-width: 600px) { .row .n { width: 45%; } .row { font-size: 17px; } .bilan .col { float: none; width: auto; } .bilan .col + .col { margin: 14px 0 0; } }

/* Code de consultation */
#codeBox { max-width: 440px; background: #1b2230; border-radius: 14px; padding: 22px; margin: 10px 0 20px; }
#codeBox p { margin: 0 0 12px; color: #cfd8e6; font-size: 17px; }
#codeBox input { width: 100%; padding: 12px; font-size: 22px; color: #fff; background: #0f141d; border: 2px solid #33405a; border-radius: 8px;
  -webkit-appearance: none; }
#codeBox button { width: 100%; margin-top: 12px; padding: 14px; font-size: 20px; font-weight: bold; color: #fff; background: #1fb85b;
  border: 0; border-radius: 10px; font-family: inherit; }
#codeErr { color: #ff8f8c; margin-top: 10px; font-size: 16px; }
#logout { display: none; }

/* Matchs en direct */
.liveH { margin: 4px 0 10px; font-size: 20px; }
.dot { display: inline-block; width: 12px; height: 12px; border-radius: 6px; background: #ff4d4d; margin-right: 8px;
  -webkit-animation: clign 1.2s infinite; animation: clign 1.2s infinite; }
@-webkit-keyframes clign { 50% { opacity: 0.2; } } @keyframes clign { 50% { opacity: 0.2; } }
.live { background: #1b2230; border: 2px solid #8a2b2b; border-radius: 12px; padding: 12px 16px; margin-bottom: 12px; }
.live.fin { border-color: #1f5f3a; }
.live .top { margin-bottom: 4px; }
.lr { overflow: hidden; font-size: 22px; line-height: 46px; }
.lr .n { float: left; width: 55%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.lr .sv { display: inline-block; width: 12px; height: 12px; border-radius: 6px; background: #fff; margin-left: 8px; vertical-align: middle; }
.lr .pt { float: right; width: 64px; margin-left: 10px; text-align: center; font-size: 32px; font-weight: bold; background: #10141c; border-radius: 8px; }
.lr .gm { float: right; width: 40px; text-align: center; font-weight: bold; color: #9fb0c8; }
.live .sets { margin-top: 6px; color: #9fb0c8; font-size: 15px; }
.colh { overflow: hidden; color: #5c6b82; font-size: 12px; }
.colh span { float: right; text-align: center; } .colh .a { width: 64px; margin-left: 10px; } .colh .b { width: 40px; }

/* Tableau des scores : 2 lignes, une colonne par manche, toujours 2 chiffres */
table.st { width: 100%; border-collapse: separate; border-spacing: 4px; margin: 0 -4px; }
.st th { padding: 0; font-size: 12px; font-weight: normal; color: #5c6b82; text-align: center; }
.st td { padding: 0; font-size: 20px; line-height: 36px; text-align: center; }
.st td.n { width: 100%; max-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; text-align: left; }
.st td.g { min-width: 36px; font-weight: bold; background: #10141c; border-radius: 6px; }
.st td.s { min-width: 36px; font-size: 18px; color: #9fb0c8; background: #151b26; border-radius: 6px; }
.st td.s.w { color: #fff; font-weight: bold; }
.st td.pt { min-width: 56px; font-size: 28px; font-weight: bold; background: #10141c; border-radius: 8px; }
.st tr.win td.n { font-weight: bold; }
.st tr.win td.n:after { content: " \2714"; color: #6fdc9a; font-size: 17px; }
.st .sv { display: inline-block; width: 12px; height: 12px; border-radius: 6px; background: #fff; margin-left: 8px; vertical-align: middle; }
@media (max-width: 600px) {
  .st td { font-size: 17px; line-height: 32px; } .st td.s { min-width: 28px; font-size: 15px; } .st td.g { min-width: 28px; }
  .st td.pt { min-width: 44px; font-size: 22px; } table.st { border-spacing: 3px; margin: 0 -3px; }
}
</style>
</head>
<body>
<div class="wrap">
  <h1><img class="logo" src="logo.svg" width="40" height="40" alt="">Résultats</h1>
  <div class="bar">
    <a href="./">&#8592; Tableau de score</a>
    <a href="#" id="backLink" style="display:none">&#8592; Retour</a>
    <button id="reload">&#8635; Actualiser</button>
    <button id="logout">Changer de code</button>
  </div>
  <div id="status">Chargement…</div>
  <form id="codeBox" style="display:none" action="#">
    <p>Entrez le code de consultation donné par le club.</p>
    <input type="password" id="codeIn" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button type="submit">Voir les résultats</button>
    <div id="codeErr"></div>
  </form>
  <div id="view"></div>
</div>

<script src="config.js"></script>
<script>
// ES5 uniquement (Safari 9)
(function () {
  'use strict';
  var all = [], loaded = false, n = 0;
  var JOURS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function status(t, err) { $('status').textContent = t; $('status').className = err ? 'err' : ''; }

  function dayOf(m) { return m.journee || String(m.date || '').slice(0, 10); }
  function frDay(d) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d || '');
    if (!m) return esc(d);
    var dt = new Date(+m[1], +m[2] - 1, +m[3]);
    return JOURS[dt.getDay()] + ' ' + m[3] + '/' + m[2] + '/' + m[1];
  }
  function hour(d) { var m = /(\d{2}):(\d{2})/.exec(d || ''); return m ? m[1] + 'h' + m[2] : ''; }
  function won1(m) { return (parseInt(m.manches1, 10) || 0) > (parseInt(m.manches2, 10) || 0); }

  // Une partie rejouée remplace la précédente (même rencontre, même numéro)
  function dedupe(list) {
    var seen = {}, out = [];
    for (var i = list.length - 1; i >= 0; i--) {
      var m = list[i], k = m.rencontre_id ? m.rencontre_id + '#' + m.ordre : 'id#' + m.id;
      if (seen[k]) continue;
      seen[k] = true; out.unshift(m);
    }
    return out;
  }

  function params() {
    var o = {}, h = location.hash.replace(/^#/, '').split('&');
    for (var i = 0; i < h.length; i++) { var p = h[i].split('='); if (p[0]) o[p[0]] = decodeURIComponent(p[1] || ''); }
    return o;
  }

  // ---------- Code de consultation ----------
  var CODEKEY = 'ttScore.consult', live = [], srvNow = 0, busy = false;
  function getCode() { try { return localStorage.getItem(CODEKEY) || ''; } catch (e) { return ''; } }
  function setCode(c) { try { if (c) localStorage.setItem(CODEKEY, c); else localStorage.removeItem(CODEKEY); } catch (e) {} }

  function askCode(msg) {
    loaded = false;
    $('view').innerHTML = '';
    status('');
    $('codeErr').textContent = msg || '';
    $('codeBox').style.display = '';
    $('logout').style.display = 'none';
  }

  // silent : rafraîchissement automatique (pas de message « Chargement », on garde la position)
  function load(silent) {
    if (typeof SCORE_API === 'undefined' || !SCORE_API) { status('Le serveur de résultats n\'est pas configuré (config.js).', true); return; }
    var code = getCode();
    if (!code) { askCode(''); return; }
    if (busy) return;
    busy = true;
    if (!silent) status('Chargement…');
    var name = 'ttres' + (++n) + '_' + Date.now(), s = document.createElement('script'), done = false;
    function finish(err, data) {
      if (done) return; done = true; busy = false;
      window[name] = function () {};
      if (s.parentNode) s.parentNode.removeChild(s);
      if (data && data.code) { setCode(''); askCode('Code incorrect.'); return; }
      if (err || !data || !data.ok) { if (!silent) status('Impossible de charger les résultats. Vérifiez la connexion.', true); return; }
      all = dedupe(data.matchs || []);
      live = data.direct || [];
      srvNow = data.maintenant || 0;
      loaded = true;
      $('codeBox').style.display = 'none';
      $('logout').style.display = '';
      status('');
      route(silent);
    }
    window[name] = function (d) { finish(null, d); };
    s.onerror = function () { finish('reseau'); };
    setTimeout(function () { finish('reseau'); }, 20000);
    s.src = SCORE_API + (SCORE_API.indexOf('?') < 0 ? '?' : '&') + 'action=list&code=' + encodeURIComponent(code) +
      '&callback=' + name + '&_=' + Date.now();
    document.body.appendChild(s);
  }

  // ---------- Matchs en direct ----------
  function liveDay(e) { return e.r ? e.r.j : e.j; }

  function liveCard(e) {
    var ago = srvNow && e.maj ? Math.max(0, Math.round((srvNow - e.maj) / 1000)) : 0;
    var agoTxt = ago < 60 ? 'il y a ' + ago + ' s' : 'il y a ' + Math.round(ago / 60) + ' min';
    var lbl = e.r ? 'Partie ' + (e.r.i + 1) + ' · ' + esc(String(e.r.l).replace(/^([A-D])([W-Z])$/, '$1 – $2')) : 'Match simple';
    var h = '<div class="live' + (e.fin ? ' fin' : '') + '"><div class="top"><span class="r">' + agoTxt + ' · en ' + esc(e.bo) + '</span>' +
      (e.fin ? '<span class="lbl">Terminé</span>' : '<span class="dot"></span><span class="lbl">En direct</span>') + lbl +
      (e.r ? ' · <span class="c1">' + esc(e.r.c1) + '</span> – <span class="c2">' + esc(e.r.c2) + '</span>' : '') +
      (e.r && e.r.a ? ' · Arbitre : ' + esc(e.r.a) : '') + '</div>';
    return h + scoreTable([e.n[0], e.n[1]], [e.g[0], e.g[1]], e.h || [], e.fin ? null : [e.p[0], e.p[1]], e.fin ? -1 : e.sv) + '</div>';
  }

  function liveHtml(filter) {
    var h = '', nb = 0;
    for (var i = 0; i < live.length; i++) if (filter(live[i])) { h += liveCard(live[i]); nb++; }
    return nb ? '<div class="liveH"><span class="dot"></span>Matchs en cours (' + nb + ')</div>' + h : '';
  }

  function route(silent) {
    if (!loaded) return;
    var p = params();
    var back = $('backLink');
    if (p.r) { back.style.display = ''; back.href = '#j=' + encodeURIComponent(p.j); }
    else if (p.j) { back.style.display = ''; back.href = '#'; }
    else back.style.display = 'none';
    if (p.j && p.r === 'libre') viewLibres(p.j);
    else if (p.j && p.r) viewRencontre(p.j, p.r);
    else if (p.j) viewJournee(p.j);
    else viewJournees();
    if (!silent) window.scrollTo(0, 0);
  }

  // 1) Liste des journées
  function viewJournees() {
    var days = {}, keys = [], i, d;
    for (i = 0; i < all.length; i++) {
      d = dayOf(all[i]);
      if (!days[d]) { days[d] = { renc: {}, nr: 0, libres: 0 }; keys.push(d); }
      if (all[i].rencontre_id) { if (!days[d].renc[all[i].rencontre_id]) { days[d].renc[all[i].rencontre_id] = 1; days[d].nr++; } }
      else days[d].libres++;
    }
    for (i = 0; i < live.length; i++) {
      d = liveDay(live[i]);
      if (d && !days[d]) { days[d] = { renc: {}, nr: 0, libres: 0 }; keys.push(d); }
    }
    keys.sort().reverse();
    var h = liveHtml(function () { return true; }) + '<h2>Choisissez une journée</h2>';
    for (i = 0; i < keys.length; i++) {
      d = days[keys[i]];
      var sub = [];
      if (d.nr) sub.push(d.nr + ' rencontre' + (d.nr > 1 ? 's' : ''));
      if (d.libres) sub.push(d.libres + ' match' + (d.libres > 1 ? 's' : '') + ' simple' + (d.libres > 1 ? 's' : ''));
      h += '<a class="item" href="#j=' + encodeURIComponent(keys[i]) + '"><span class="go">›</span>' + frDay(keys[i]) +
        '<span class="sub">' + sub.join(' · ') + '</span></a>';
    }
    $('view').innerHTML = (keys.length ? h : '<div class="empty">Aucun résultat enregistré pour le moment.</div>') +
      '<p class="note">Les résultats sont effacés automatiquement 3 jours après le match.</p>';
  }

  // 2) Rencontres d'une journée
  function viewJournee(day) {
    var renc = {}, ids = [], libres = 0, i, m;
    for (i = 0; i < all.length; i++) {
      m = all[i];
      if (dayOf(m) !== day) continue;
      if (!m.rencontre_id) { libres++; continue; }
      var r = renc[m.rencontre_id];
      if (!r) { r = renc[m.rencontre_id] = { c1: m.club1, c2: m.club2, s1: 0, s2: 0, nb: 0 }; ids.push(m.rencontre_id); }
      r.nb++; if (won1(m)) r.s1++; else r.s2++;
    }
    // Rencontres commencées dont aucune partie n'est encore terminée
    for (i = 0; i < live.length; i++) {
      var e = live[i];
      if (e.r && e.r.j === day && !renc[e.r.id]) { renc[e.r.id] = { c1: e.r.c1, c2: e.r.c2, s1: 0, s2: 0, nb: 0 }; ids.push(e.r.id); }
      if (!e.r && e.j === day && !libres) libres = -1;
    }
    var h = liveHtml(function (e) { return liveDay(e) === day; }) + '<h2>' + frDay(day) + '</h2>';
    for (i = 0; i < ids.length; i++) {
      var x = renc[ids[i]];
      h += '<a class="item" href="#j=' + encodeURIComponent(day) + '&r=' + encodeURIComponent(ids[i]) + '"><span class="go">›</span>' +
        '<span class="score"><span class="c1">' + esc(x.c1) + '</span><b>' + x.s1 + '</b>–<b>' + x.s2 + '</b><span class="c2">' + esc(x.c2) + '</span></span>' +
        '<span class="sub">' + x.nb + ' partie' + (x.nb > 1 ? 's' : '') + ' jouée' + (x.nb > 1 ? 's' : '') + ' sur 14</span></a>';
    }
    if (libres) h += '<a class="item" href="#j=' + encodeURIComponent(day) + '&r=libre"><span class="go">›</span>Matchs simples' +
      '<span class="sub">' + (libres > 0 ? libres + ' match' + (libres > 1 ? 's' : '') + ' terminé' + (libres > 1 ? 's' : '') : 'en cours') + '</span></a>';
    if (!ids.length && !libres) h += '<div class="empty">Aucun match ce jour-là.</div>';
    $('view').innerHTML = h;
  }

  function p2(x) { x = String(x == null ? '' : x); return x.length < 2 ? '0' + x : x; }

  // Tableau 2 lignes : nom | manches gagnées | score de chaque manche (2 chiffres) | points en cours (direct)
  function scoreTable(names, games, sets, pts, sv) {
    var g1 = parseInt(games[0], 10) || 0, g2 = parseInt(games[1], 10) || 0, i, k;
    var h = '<table class="st"><tr><th></th><th>Man.</th>';
    for (i = 0; i < sets.length; i++) h += '<th>' + (i + 1) + '</th>';
    if (pts) h += '<th>Pts</th>';
    h += '</tr>';
    for (k = 0; k < 2; k++) {
      var win = !pts && (k === 0 ? g1 > g2 : g2 > g1);
      h += '<tr' + (win ? ' class="win"' : '') + '><td class="n">' + esc(names[k]) + (sv === k ? '<span class="sv" title="Au service"></span>' : '') +
        '</td><td class="g">' + (k === 0 ? g1 : g2) + '</td>';
      for (i = 0; i < sets.length; i++) {
        var a = parseInt(sets[i][k], 10) || 0, b = parseInt(sets[i][1 - k], 10) || 0;
        h += '<td class="s' + (a > b ? ' w' : '') + '">' + p2(a) + '</td>';
      }
      if (pts) h += '<td class="pt">' + p2(pts[k]) + '</td>';
      h += '</tr>';
    }
    return h + '</table>';
  }

  function matchCard(m, label) {
    var raw = String(m.detail || '').split(' '), sets = [];
    for (var j = 0; j < raw.length; j++) { var p = raw[j].split('-'); if (p.length === 2) sets.push(p); }
    return '<div class="match"><div class="top"><button class="del" data-id="' + esc(m.id) + '" title="Supprimer ce match">&#128465; Supprimer</button>' +
      '<span class="r">' + esc(m.format || '') + (m.duree_min ? ' · ' + esc(m.duree_min) + ' min' : '') +
      '</span>' + (label ? '<span class="lbl">' + label + '</span>' : '') + hour(m.date) +
      (m.arbitre ? ' · Arbitre : ' + esc(m.arbitre) : '') + '</div>' +
      scoreTable([m.joueur1, m.joueur2], [m.manches1, m.manches2], sets, null, -1) + '</div>';
  }

  function partieLabel(m) {
    var p = String(m.partie || '');
    return esc(m.ordre) + '. ' + (/^[A-D][W-Z]$/.test(p) ? p.charAt(0) + ' – ' + p.charAt(1) : esc(p));
  }

  // 3) Détail d'une rencontre
  function viewRencontre(day, id) {
    var list = [], i, m;
    for (i = 0; i < all.length; i++) if (all[i].rencontre_id === id) list.push(all[i]);
    var lv = liveHtml(function (e) { return e.r && e.r.id === id; });
    if (!list.length) {
      var e0 = null;
      for (i = 0; i < live.length; i++) if (live[i].r && live[i].r.id === id) e0 = live[i];
      $('view').innerHTML = e0 ? '<div class="teamHead"><div class="sc"><span class="c1">' + esc(e0.r.c1) + '</span><b>0</b>–<b>0</b><span class="c2">' +
        esc(e0.r.c2) + '</span></div><div class="sub">' + frDay(day) + ' · aucune partie terminée</div></div>' + lv
        : '<div class="empty">Rencontre introuvable.</div>';
      return;
    }
    list.sort(function (a, b) { return (parseInt(a.ordre, 10) || 0) - (parseInt(b.ordre, 10) || 0); });
    var s1 = 0, s2 = 0, bil = [{}, {}], ord = [[], []];
    for (i = 0; i < list.length; i++) {
      m = list[i];
      var w = won1(m);
      if (w) s1++; else s2++;
      if (!/^Double/.test(m.partie)) {
        var names = [m.joueur1, m.joueur2];
        for (var k = 0; k < 2; k++) {
          var b = bil[k][names[k]];
          if (!b) { b = bil[k][names[k]] = { v: 0, d: 0 }; ord[k].push(names[k]); }
          if ((k === 0) === w) b.v++; else b.d++;
        }
      }
    }
    var f = list[0];
    var h = '<div class="teamHead"><div class="sc"><span class="c1">' + esc(f.club1) + '</span><b>' + s1 + '</b>–<b>' + s2 + '</b><span class="c2">' + esc(f.club2) + '</span></div>' +
      '<div class="sub">' + frDay(day) + ' · ' + list.length + ' partie' + (list.length > 1 ? 's' : '') + ' jouée' + (list.length > 1 ? 's' : '') + ' sur 14</div>' +
      '<button class="delR" data-renc="' + esc(id) + '" data-day="' + esc(day) + '">&#128465; Supprimer toute la rencontre</button></div>';
    h += lv;
    for (i = 0; i < list.length; i++) h += matchCard(list[i], partieLabel(list[i]));

    h += '<div class="bilan">';
    var clubs = [f.club1, f.club2];
    for (k = 0; k < 2; k++) {
      h += '<div class="col"><h3 class="c' + (k + 1) + '">Bilan ' + esc(clubs[k]) + ' (simples)</h3>';
      for (i = 0; i < ord[k].length; i++) {
        var x = bil[k][ord[k][i]];
        h += '<div class="p">' + esc(ord[k][i]) + '<span>' + x.v + ' V · ' + x.d + ' D</span></div>';
      }
      h += '</div>';
    }
    $('view').innerHTML = h + '</div>';
  }

  // Matchs simples d'une journée
  function viewLibres(day) {
    var lv = liveHtml(function (e) { return !e.r && e.j === day; });
    var h = '<h2>Matchs simples · ' + frDay(day) + '</h2>' + lv, nb = 0;
    for (var i = all.length - 1; i >= 0; i--) {
      if (all[i].rencontre_id || dayOf(all[i]) !== day) continue;
      h += matchCard(all[i], ''); nb++;
    }
    $('view').innerHTML = nb || lv ? h : '<div class="empty">Aucun match simple ce jour-là.</div>';
  }

  // ---------- Suppression d'un match ou d'une rencontre ----------
  function apiDel(params, cb) {
    var name = 'ttdel' + (++n) + '_' + Date.now(), s = document.createElement('script'), done = false;
    function finish(err, d) {
      if (done) return; done = true;
      window[name] = function () {};
      if (s.parentNode) s.parentNode.removeChild(s);
      cb(err, d);
    }
    window[name] = function (d) { finish(null, d); };
    s.onerror = function () { finish('reseau'); };
    setTimeout(function () { finish('reseau'); }, 20000);
    var qs = 'action=del&code=' + encodeURIComponent(getCode()) + '&callback=' + name;
    for (var k in params) if (params.hasOwnProperty(k)) qs += '&' + k + '=' + encodeURIComponent(params[k]);
    s.src = SCORE_API + (SCORE_API.indexOf('?') < 0 ? '?' : '&') + qs;
    document.body.appendChild(s);
  }

  $('view').addEventListener('click', function (ev) {
    var b = ev.target;
    while (b && b !== this && !(b.className === 'del' || b.className === 'delR')) b = b.parentNode;
    if (!b || b === this) return;
    var renc = b.getAttribute('data-renc');
    if (!window.confirm(renc ? 'Supprimer toute la rencontre (toutes ses parties) ? C\'est définitif.' : 'Supprimer ce match ? C\'est définitif.')) return;
    status('Suppression…');
    apiDel(renc ? { rencontre: renc } : { id: b.getAttribute('data-id') }, function (err, d) {
      if (d && d.code) { setCode(''); askCode('Code incorrect.'); return; }
      if (err || !d || !d.ok) { status('Suppression impossible. Vérifiez la connexion.', true); return; }
      status(d.supprimes ? 'Supprimé.' : 'Déjà supprimé.');
      if (renc) location.hash = '#j=' + encodeURIComponent(b.getAttribute('data-day'));
      load(true);
    });
  }, false);

  $('reload').addEventListener('click', function () { load(false); }, false);
  $('logout').addEventListener('click', function () { setCode(''); askCode(''); }, false);
  $('codeBox').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var c = $('codeIn').value.replace(/^\s+|\s+$/g, '');
    if (!c) return;
    $('codeIn').blur();
    setCode(c);
    $('codeErr').textContent = '';
    load(false);
  }, false);
  window.addEventListener('hashchange', function () { route(false); }, false);
  // Rafraîchissement automatique toutes les 5 s (page visible uniquement)
  setInterval(function () { if (loaded && !document.hidden) load(true); }, 5000);
  load(false);
})();
</script>
</body>
</html>
